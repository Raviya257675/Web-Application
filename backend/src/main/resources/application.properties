spring.application.name=Meridian HMS
app.assistant.provider=${MERIDIAN_AI_PROVIDER:ollama}
app.assistant.api-key=${OPENAI_API_KEY:}
app.assistant.model=${MERIDIAN_AI_MODEL:qwen3:1.7b}
app.assistant.endpoint=${MERIDIAN_AI_ENDPOINT:http://127.0.0.1:11434/api/chat}
server.port=8080
server.compression.enabled=true
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------------------
# Database - file backed H2, so the application runs with zero external setup.
# Data survives restarts in ./data/. Use the "mysql" profile for MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/meridian;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
app.jwt.secret=${MERIDIAN_JWT_SECRET:meridian-hms-spring-boot-jwt-secret-key-change-me-in-production-2026}
app.jwt.access-minutes=720
app.jwt.refresh-days=7

app.invoice.tax-rate=0.05
app.invoice.due-days=14
app.cancellation-window-hours=2
app.pharmacy.low-stock-notify=true
app.seed.enabled=${APP_SEED_ENABLED:false}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:5000,http://127.0.0.1:5000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# Demo data / session tuning
server.servlet.session.timeout=60m
